name: Tests

on:
  push:
    branches: [main, master, develop, backend, frontend]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-secret-key-not-for-production
  DATABASE_URL: sqlite:///./test.db

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.9
      - name: Ejecutar ruff
        run: ruff check app

  black:
    name: Formato (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install black==26.5.1
      - name: Verificar formato
        run: black --check app

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - app/tests/test_auth.py
          - app/tests/test_categories.py
          - app/tests/test_products.py
          - app/tests/test_tables.py
          - app/tests/test_orders.py
          - app/tests/test_payments.py
          - app/tests/test_kitchen.py
          - app/tests/test_deploy.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar entorno
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -c "import app.main"

      - name: Ejecutar tests
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -m pytest "${{ matrix.file }}" -v --tb=short

  coverage:
    name: Tests con cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite completa con cobertura
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -m pytest app/tests \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Subir informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilar para web
        run: flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=https://api.example.com/api/v1

  android-apk:
    name: APK de Android
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK (release)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://fastapi.sbs.mom/api/v1

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: origen-cafe-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-app:
    name: App de Windows
    runs-on: windows-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar (release)
        run: flutter build windows --release --dart-define=API_BASE_URL=https://fastapi.sbs.mom/api/v1

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath origen-cafe-windows.zip

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: origen-cafe-windows
          path: frontend/origen-cafe-windows.zip
          if-no-files-found: error

  docker-backend:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t cafeteria-api .
      - name: Arrancar y comprobar /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key-not-for-production-0123456789 \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            cafeteria-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  import-check:
    name: Import de la aplicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verificar que app.main importa y expone el OpenAPI
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -c "
          from app.main import app
          paths = app.openapi()['paths']
          print(f'{len(paths)} endpoints registrados')
          assert '/health' in paths, 'falta /health'
          assert '/api/v1/auth/login' in paths, 'falta /api/v1/auth/login'
          "