services:
  api:
    build: .
    restart: unless-stopped

    # El puerto PUBLICADO en el host es configurable. El puerto interno del
    # contenedor sigue siendo 8000 (ver Dockerfile); esto solo cambia el mapeo.
    # Coolify lee las variables del Environment Variables de la UI, no de este repo.
    ports:
      - "${API_PORT:-8010}:8000"

    env_file:
      - .env

    environment:
      # Sobrescribe la base de datos para usar SQLite con volumen persistente en Docker
      - DATABASE_URL=sqlite:////app/data/cafeteria.db
      - SECRET_KEY=${SECRET_KEY}

      # Dominio(s) del frontend permitidos por CORS, separados por comas.
      # Ej.: https://cafe.midominio.com  (con `*` se permite cualquiera).
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

      # Carga el menú y las mesas de ejemplo SOLO si la base está vacía.
      # Nunca borra ni sobrescribe datos existentes.
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}

      # Administrador inicial. Solo se usa si la tabla de usuarios está vacía.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-Administrador}

    volumes:
      - cafeteria_data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cafeteria_data: